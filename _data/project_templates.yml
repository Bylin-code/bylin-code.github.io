# Reusable project gallery styles. Every style supports 1–10 ordered images.
- id: split
  label: Split
  flippable: true
  flip_description: Swap the text and gallery between the left and right sides.
  description: Project text beside a vertical image column; use Flip to choose the side.

- id: rows
  label: Rows
  flippable: true
  flip_description: Move the text above the first image row instead of below it.
  description: Images divided into rows above and below the project introduction.

- id: editorial
  label: Editorial
  flippable: true
  flip_description: Swap the editorial gallery and text between the left and right sides.
  description: Images distributed around the copy in a magazine-style composition.

- id: masonry
  label: Masonry
  flippable: true
  flip_description: Move the full masonry gallery above the text instead of below it.
  description: A two-column introduction followed by a natural-height image grid.

- id: hero
  label: Hero
  flippable: true
  flip_description: Swap the supporting gallery and text below the hero image.
  description: One wide lead image followed by the project copy and supporting images.

- id: filmstrip
  label: Filmstrip
  flippable: true
  flip_description: Move the large lead image above the text instead of below it.
  description: Full-width introduction, a large lead image, and a compact three-column strip.
