<div class="gallery-item">
  <div class="gallery-image{% if include.hero %} gallery-hero-image{% endif %}"{% if include.item.aspect_ratio %} style="aspect-ratio: {{ include.item.aspect_ratio | escape }}"{% endif %}>
    <img src="{{ include.item.image | relative_url }}" alt="{{ include.item.alt | default: include.item.caption | strip_html | escape }}" loading="lazy"{% if include.item.fit or include.item.position %} style="{% if include.item.fit %}object-fit: {{ include.item.fit | escape }};{% endif %}{% if include.item.position %}object-position: {{ include.item.position | escape }};{% endif %}"{% endif %} />
  </div>
  {% include project/figure-caption.html number=include.number caption=include.item.caption %}
</div>
