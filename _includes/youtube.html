{% assign youtube_title = include.title | default: "YouTube video player" %}
<div class="video-container">
  <iframe
    width="560"
    height="315"
    src="https://www.youtube-nocookie.com/embed/{{ include.id | escape }}"
    title="{{ youtube_title | escape }}"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
    loading="lazy"></iframe>
</div>
